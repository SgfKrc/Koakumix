[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "koakumix"
version = "0.1.0"
description = "Koakumix — local small-model harness workbench (prefix-cache-first enhancement layer)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
tui = ["textual>=8.2"]
api = ["fastapi>=0.110", "uvicorn>=0.30"]
desktop = ["pywebview>=5.0", "fastapi>=0.110", "uvicorn>=0.30"]

[project.scripts]
koakumix = "harness_workbench.cli:main"
koakumix-tui = "harness_workbench.tui:main"
koakumix-desktop = "harness_workbench.desktop:main"

[tool.setuptools]
package-dir = { "harness_workbench" = "." }

[tool.setuptools.packages.find]
where = ["."]
include = ["harness_workbench*"]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["tests"]
